[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-hallucination-detection"
version = "0.1.0"
description = "Master thesis pipeline for cross-model LLM hallucination detection."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
