name: thesis-hallucination
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy=1.26
  - scipy=1.12
  - scikit-learn=1.5
  - tqdm=4.67
  - pytest=7.4
  - pip:
      # CUDA 12.6 build, matching the environment used for the cleaned pipeline.
      # For a CPU-only environment, replace this with torch==2.6.0.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.6.0+cu126
      - transformers==4.51.3
      - sentence-transformers==5.3.0
      - huggingface-hub==0.34.4
      - accelerate==1.12.0
      - bitsandbytes==0.49.2
      - ftfy==6.3.1
      - safetensors==0.5.2
      - tokenizers==0.21.4
